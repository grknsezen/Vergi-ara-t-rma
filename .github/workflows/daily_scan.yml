name: Gunluk YMM Mevzuat Taramasi

on:
  schedule:
    - cron: "30 4 * * *"   # Her sabah 07:30 (Türkiye saati UTC+3)
  workflow_dispatch:        # Şimdi manuel çalıştırmak için

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt

      - name: Ajan ekibini calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: python -u run_daily.py

      - name: Ciktiları kaydet
        run: |
          git config user.name "ymm-bot"
          git config user.email "ymm-bot@users.noreply.github.com"
          git add outputs/ team.md
          git diff --staged --quiet || git commit -m "Gunluk YMM bulteni guncellendi"
          git push
