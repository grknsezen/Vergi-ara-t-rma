<script>
  const SECTORS = ["Tümü", "İhracat", "İnşaat", "Üretim", "Hizmet", "E-Ticaret", "Genel"];
  let activeSector = "Tümü";
  let currentBulletin = null;
  let gibArchive = [];
  let currentQuestions = [];
  let currentSubject = "";
  let cachedModels = null;

  const FALLBACK_BULLETIN = {
    tarih: "Henüz tarama çalıştırılmadı",
    denetci_puani: "-",
    kaynak_durumu: {},
    gelismeler: []
  };

  window.addEventListener("DOMContentLoaded", () => {
    const savedKey = localStorage.getItem("gemini_api_key");
    if (savedKey) document.getElementById("apiKeyInput").value = savedKey;
    renderSectorChips();
    loadBulletin();
    loadGibArchive();
    renderMistakes();
  });

  function saveApiKey() {
    const key = document.getElementById("apiKeyInput").value.trim();
    localStorage.setItem("gemini_api_key", key);
    cachedModels = null;
    alert("API anahtarı yalnızca bu tarayıcıya (localStorage) kaydedildi.");
  }

  function getApiKey() {
    const key = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value.trim();
    if (!key) {
      alert("Lütfen önce sağ üstten Gemini API anahtarını girip Kaydet'e bas.");
      return null;
    }
    return key;
  }

  function switchTab(id, btn) {
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("tab-" + id).classList.add("active");
    if (btn) btn.classList.add("active");
  }

  /* --- 1. BÜLTEN & GİB ARŞİVİ --- */
  function renderSectorChips() {
    const box = document.getElementById("sectorChips");
    box.innerHTML = SECTORS.map(s =>
      `<button class="chip ${s === activeSector ? 'active' : ''}" onclick="setSector('${s}')">${s}</button>`
    ).join("");
  }

  function setSector(s) {
    activeSector = s;
    renderSectorChips();
    renderBulletin();
  }

  async function loadGibArchive() {
    try {
      const res = await fetch("./data/gib_mevzuat.json?t=" + Date.now());
      if (!res.ok) return;
      const data = await res.json();
      if (Array.isArray(data)) {
        gibArchive = data;
        document.getElementById("arsivSayac").textContent = `GİB Arşiv: ${gibArchive.length} kayıt`;
      }
    } catch {
      // Henüz arşiv oluşmadıysa sessiz geç
    }
  }

  async function loadBulletin() {
    try {
      const res = await fetch("./outputs/latest.json?t=" + Date.now());
      if (!res.ok) throw new Error("Henüz JSON yok");
      currentBulletin = await res.json();
    } catch {
      currentBulletin = FALLBACK_BULLETIN;
    }
    loadGibArchive();
    renderBulletin();
  }

  function renderBulletin() {
    const b = currentBulletin;
    document.getElementById("bultenTarih").textContent = "Bülten Tarihi: " + b.tarih;
    document.getElementById("denetciPuan").textContent = `Denetçi: ${b.denetci_puani}/5`;
    document.getElementById("kaynakDurum").textContent =
      "Kaynaklar: " + Object.entries(b.kaynak_durumu || {}).map(([k, v]) => `${k}: ${v}`).join(" | ");

    const items = (b.gelismeler || []).filter(item =>
      activeSector === "Tümü" || (item.sektorler || []).includes(activeSector)
    );

    const list = document.getElementById("bultenListesi");
    if (!items.length) {
      list.innerHTML = `<div class="card">Bu tarihte veya filtrede gösterilecek mevzuat gelişmesi yok.</div>`;
      return;
    }

    list.innerHTML = items.map(item => {
      const cls = item.oncelik === "KRITIK" ? "b-kritik" : item.oncelik === "IZLENECEK" ? "b-izlenecek" : "b-bilgi";
      const tags = (item.sektorler || []).map(s => `<span class="badge b-bilgi">${s}</span>`).join("");
      return `
        <div class="card">
          <div>
            <span class="badge ${cls}">${item.oncelik} • ${item.durum}</span>
            ${tags}
          </div>
          <h3 style="margin:8px 0 4px;">${item.baslik}</h3>
          <div class="meta"><strong>Ref:</strong> ${item.mevzuat_ref} | <strong>Yürürlük:</strong> ${item.yururluk_tarihi} | <strong>Alan:</strong> ${item.etkilenen_alan}</div>
          <p style="margin:8px 0;"><strong>YMM Aksiyonu:</strong> ${item.ymm_aksiyonu}</p>
          <a href="${item.kaynak_url}" target="_blank" rel="noopener">Resmi Kaynağa Git →</a>
        </div>
      `;
    }).join("");
  }

  function findRelevantArchive(question) {
    if (!gibArchive.length) return [];
    const words = question.toLowerCase().split(/\s+/).filter(w => w.length > 2);
    return gibArchive
      .map(item => {
        const hay = (item.baslik || "").toLowerCase();
        const score = words.reduce((acc, w) => acc + (hay.includes(w) ? 1 : 0), 0);
        return { item, score };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 8)
      .map(x => x.item);
  }

  /* --- GEMINI API YARDIMCISI (AKTİF MODEL KEŞİFLİ) --- */
  async function discoverModels(key) {
    if (cachedModels && cachedModels.length) return cachedModels;
    const list = ["gemini-3.8-flash"];
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
      const data = await res.json();
      if (Array.isArray(data.models)) {
        const extras = data.models
          .map(m => (m.name || "").replace("models/", ""))
          .filter(n =>
            n.includes("gemini") &&
            !n.includes("2.5") &&
            !n.includes("image") &&
            !n.includes("embedding") &&
            !n.includes("tts") &&
            !n.includes("audio")
          );
        extras.sort((a, b) => (a.includes("flash") ? -1 : 1) - (b.includes("flash") ? -1 : 1));
        for (const m of extras) {
          if (!list.includes(m)) list.push(m);
        }
      }
    } catch {
      // Liste alınamazsa varsayılan listeden devam et
    }
    cachedModels = list.slice(0, 4);
    return cachedModels;
  }

  async function callGemini(systemInstruction, userPrompt, jsonMode = false) {
    const key = getApiKey();
    if (!key) return null;

    const models = await discoverModels(key);
    const body = {
      system_instruction: { parts: [{ text: systemInstruction }] },
      contents: [{ role: "user", parts: [{ text: userPrompt }] }],
      generationConfig: {
        temperature: jsonMode ? 0.2 : 0.3,
        ...(jsonMode ? { responseMimeType: "application/json" } : {})
      }
    };

    let lastErr = "API şu an yanıt vermiyor (503 yoğunluk)";
    for (const model of models) {
      for (const ver of ["v1beta", "v1"]) {
        const url = `https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            return data.candidates[0].content.parts[0].text;
          }
          if (res.status === 404) continue;
          lastErr = data.error?.message || `HTTP ${res.status}`;
          break;
        } catch (e) {
          lastErr = e.message;
          break;
        }
      }
    }
    throw new Error(lastErr);
  }

  /* --- 2. VERGİ DANIŞMANLIĞI --- */
  async function askTaxAdvisor() {
    const q = document.getElementById("taxQuestion").value.trim();
    if (!q) return;
    const btn = document.getElementById("askTaxBtn");
    const box = document.getElementById("taxAnswer");
    btn.disabled = true;
    box.style.display = "block";
    box.textContent = "GİB arşivi ve mevzuat taranıyor...";

    const matched = findRelevantArchive(q);
    const sys = `Sen kıdemli bir Türk Yeminli Mali Müşaviri (YMM) danışmanısın.
Soruları KVK, GVK, KDV, VUK, ÖTV ve arşivdeki GİB kayıtları ışığında; 1) Kısa Cevap, 2) İlgili GİB Arşiv Kayıtları & Kanuni Dayanak, 3) Uygulama/Muhasebe Etkisi başlıklarıyla net yanıtla.
Arşivde doğrudan ilgili kayıt yoksa bunu açıkça belirt ve emin olmadığın numara/oran uydurma.`;

    const archiveContext = matched.length
      ? `\nEşleşen GİB Arşiv Kayıtları:\n${JSON.stringify(matched, ensure_ascii=False)}`
      : "\nEşleşen GİB Arşiv Kaydı: Yok (genel mevzuat çerçevesinde değerlendir).";
    const bulletinContext = currentBulletin?.gelismeler?.length
      ? `\nGünün Bülteni:\n${JSON.stringify(currentBulletin.gelismeler)}`
      : "";

    try {
      const answer = await callGemini(sys, q + archiveContext + bulletinContext, false);
      if (answer) box.textContent = answer;
    } catch (err) {
      box.textContent = "Hata: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  /* --- 3. SMMM TEST ÜRETİCİ --- */
  const QUIZ_SYSTEM_PROMPT = `Sen TÜRMOB SMMM Yeterlilik sınavına hazırlık eğitmenisin.
Güncel Türk vergi/muhasebe mevzuatına uygun çoktan seçmeli sorular üret.
Çıktıyı SADECE şu JSON dizisi olarak ver:
[
  {
    "soru": "...",
    "secenekler": ["A) ...", "B) ...", "C) ...", "D) ..."],
    "dogru_index": 0,
    "aciklama": "Kanun maddesi veya standart dayanağıyla kısa açıklama."
  }
]`;

  function renderQuizQuestions(questions, titleNote = "") {
    currentQuestions = questions;
    const container = document.getElementById("quizContainer");
    const headerHtml = titleNote ? `<div class="card"><span class="badge b-ok">${titleNote}</span></div>` : "";
    container.innerHTML = headerHtml + currentQuestions.map((q, qi) => `
      <div class="card" id="q-${qi}">
        <strong>Soru ${qi + 1}:</strong> ${q.soru}
        <div style="margin-top:10px;">
          ${q.secenekler.map((opt, oi) => `
            <div class="q-option" onclick="checkAnswer(${qi}, ${oi}, ${q.dogru_index}, this)">${opt}</div>
          `).join("")}
        </div>
        <div id="exp-${qi}" class="answer-box" style="display:none;"><strong>Açıklama:</strong> ${q.aciklama}</div>
      </div>
    `).join("");
  }

  async function generateQuiz() {
    const subject = document.getElementById("smmmSubject").value;
    const count = document.getElementById("smmmCount").value;
    const btn = document.getElementById("genQuizBtn");
    const container = document.getElementById("quizContainer");
    btn.disabled = true;
    container.innerHTML = `<div class="card">SMMM yeterlilik soruları hazırlanıyor...</div>`;

    try {
      const raw = await callGemini(QUIZ_SYSTEM_PROMPT, `Ders: ${subject}. Adet: ${count} soru üret.`, true);
      if (!raw) return;
      currentSubject = subject;
      renderQuizQuestions(JSON.parse(raw), `${subject} — ${count} Soru`);
    } catch (err) {
      container.innerHTML = `<div class="card">Hata: ${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function checkAnswer(qi, selected, correct, el) {
    const parent = document.getElementById("q-" + qi);
    if (parent.dataset.answered) return;
    parent.dataset.answered = "1";

    const options = parent.querySelectorAll(".q-option");
    options[correct].classList.add("correct");
    if (selected !== correct) {
      el.classList.add("wrong");
      addMistake(currentQuestions[qi], currentSubject, selected);
    }
    document.getElementById("exp-" + qi).style.display = "block";
  }

  /* --- 4. HATA DEFTERİ & TEKRAR TESTİ --- */
  function getMistakes() {
    try {
      return JSON.parse(localStorage.getItem("smmm_hata_defteri") || "[]");
    } catch {
      return [];
    }
  }

  function saveMistakes(list) {
    localStorage.setItem("smmm_hata_defteri", JSON.stringify(list));
    renderMistakes();
  }

  function addMistake(q, subject, selectedIndex) {
    const list = getMistakes();
    if (list.some(item => item.soru === q.soru)) return;
    list.unshift({
      id: Date.now(),
      tarih: new Date().toLocaleDateString("tr-TR"),
      ders: subject || "Genel Tekrar",
      soru: q.soru,
      senin_cevabin: q.secenekler[selectedIndex],
      dogru_cevap: q.secenekler[q.dogru_index],
      aciklama: q.aciklama
    });
    saveMistakes(list);
  }

  function removeMistake(id) {
    saveMistakes(getMistakes().filter(item => item.id !== id));
  }

  function clearAllMistakes() {
    if (!confirm("Hata Defteri'ndeki tüm kayıtlar silinsin mi?")) return;
    saveMistakes([]);
  }

  function renderMistakes() {
    const list = getMistakes();
    document.getElementById("mistakeCount").textContent = list.length;

    const filter = document.getElementById("mistakeFilter")?.value || "Tümü";
    const filtered = filter === "Tümü" ? list : list.filter(i => i.ders === filter);
    const box = document.getElementById("mistakesContainer");

    if (!filtered.length) {
      box.innerHTML = `<div class="card">Bu filtrede kayıtlı hata yok.</div>`;
      return;
    }

    box.innerHTML = filtered.map(item => `
      <div class="card">
        <div class="toolbar" style="margin-bottom:8px;">
          <div>
            <span class="badge b-kritik">${item.ders}</span>
            <span class="small-note">${item.tarih}</span>
          </div>
          <button class="chip" onclick="removeMistake(${item.id})">✓ Öğrendim (Sil)</button>
        </div>
        <p style="margin:6px 0;"><strong>Soru:</strong> ${item.soru}</p>
        <p style="margin:4px 0; color:var(--danger);"><strong>Senin Cevabın:</strong> ${item.senin_cevabin}</p>
        <p style="margin:4px 0; color:var(--ok);"><strong>Doğru Cevap:</strong> ${item.dogru_cevap}</p>
        <div class="answer-box" style="margin-top:8px;"><strong>Dayanak:</strong> ${item.aciklama}</div>
      </div>
    `).join("");
  }

  async function generateReviewQuiz() {
    const filter = document.getElementById("mistakeFilter").value;
    const all = getMistakes();
    const target = (filter === "Tümü" ? all : all.filter(i => i.ders === filter)).slice(0, 5);

    if (!target.length) {
      alert("Tekrar testi üretmek için Hata Defteri'nde en az 1 kayıt olmalı.");
      return;
    }

    const btn = document.getElementById("reviewQuizBtn");
    btn.disabled = true;
    switchTab("smmm", document.getElementById("tabBtn-smmm"));
    document.getElementById("quizContainer").innerHTML =
      `<div class="card">Hata Defteri'ndeki zayıf konularına özel tekrar testi hazırlanıyor...</div>`;

    const summary = target.map(m => `- Ders: ${m.ders} | Yanlış yapılan konu/soru: ${m.soru} | Dayanak: ${m.aciklama}`).join("\n");
    const prompt = `Aşağıdaki yanlış yapılan SMMM sorularının tam olarak aynı konularını ve mevzuat noktalarını ölçen, ancak farklı kurgulanmış 3 adet yeni çoktan seçmeli tekrar sorusu üret:\n${summary}`;

    try {
      const raw = await callGemini(QUIZ_SYSTEM_PROMPT, prompt, true);
      if (!raw) return;
      currentSubject = filter === "Tümü" ? "Tekrar Testi (Karma)" : filter;
      renderQuizQuestions(JSON.parse(raw), `Zayıf Konular Tekrar Testi (${target.length} hatadan üretildi)`);
    } catch (err) {
      document.getElementById("quizContainer").innerHTML = `<div class="card">Hata: ${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }
</script>
