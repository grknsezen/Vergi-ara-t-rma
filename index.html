<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vergi Asistanı" />
  <link rel="manifest" href="manifest.json" />
  <title>Vergi Araştırma Asistanı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 104px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 12px); }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 6px); }
    #bottomNav {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 9999 !important;
    }
  </style>
  <script>
    (function () {
      const TABS = ["konu", "soru", "sohbet", "hatalar", "ayarlar"];
      function applyTabState(tab) {
        const target = TABS.includes(tab) ? tab : "konu";
        TABS.forEach((t) => {
          const sec = document.getElementById("tab-" + t);
          if (sec) sec.classList.toggle("hidden", t !== target);
          const nav = document.getElementById("nav-" + t);
          if (nav) {
            nav.className = t === target
              ? "flex flex-col items-center justify-center py-1 text-[11px] font-bold text-slate-900"
              : "flex flex-col items-center justify-center py-1 text-[11px] font-medium text-slate-500";
          }
        });
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
        document.dispatchEvent(new CustomEvent("vergi:tabchanged", { detail: { tab: target } }));
      }
      window.__coreSwitchTab = applyTabState;
      window.switchTab = applyTabState;

      document.addEventListener("click", function (ev) {
        const btn = ev.target.closest("#nav-konu, #nav-soru, #nav-sohbet, #nav-hatalar, #nav-ayarlar, [data-tab]");
        if (!btn) return;
        const tab = btn.dataset.tab || (btn.id ? btn.id.replace("nav-", "") : "");
        if (TABS.includes(tab)) {
          ev.preventDefault();
          applyTabState(tab);
        }
      }, true);

      function ensureBottomNavVisible() {
        const nav = document.getElementById("bottomNav");
        if (!nav) return;
        nav.style.position = "fixed";
        nav.style.left = "0";
        nav.style.right = "0";
        nav.style.bottom = "0";
        nav.style.display = "block";
        nav.style.visibility = "visible";
        nav.style.opacity = "1";
        nav.style.zIndex = "9999";
      }

      document.addEventListener("DOMContentLoaded", ensureBottomNavVisible);
      window.addEventListener("load", ensureBottomNavVisible);
      setInterval(ensureBottomNavVisible, 1500);
    })();
  </script>
</head>

              Tebliğler
            </button>
            <button id="cat-ozelgeler" type="button" onclick="selectCategoryFromUi('ozelgeler')" data-category="ozelgeler"
              class="law-cat-btn cursor-pointer rounded-lg py-2
